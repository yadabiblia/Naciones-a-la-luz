<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iglesia Bíblica Naciones a la Luz</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
      /* Color de fondo idéntico al de la imagen para que se integre sin bordes */
      background-color: #3c4043; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .pantalla-inicio {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 900px;
      padding: 20px;
      animation: aparecer 1.2s ease-out;
    }

    .logo-principal {
      width: 100%;
      max-width: 650px;
      height: auto;
      margin-bottom: 40px;
    }

    .btn-inicio {
      background-color: #d99b26; /* Dorado del logo */
      color: #ffffff;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 15px 45px;
      border-radius: 50px;
      border: 2px solid #d99b26;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-inicio:hover {
      background-color: transparent;
      color: #d99b26;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(217, 155, 38, 0.4);
    }

    .btn-inicio:active {
      transform: translateY(0);
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Ajustes para celulares */
    @media (max-width: 600px) {
      .logo-principal {
        max-width: 90%;
        margin-bottom: 30px;
      }
      .btn-inicio {
        font-size: 1rem;
        padding: 12px 35px;
      }
    }
  </style>
</head>
<body>

  <main class="pantalla-inicio">
    <!-- Asegúrate de guardar la imagen en la misma carpeta con el nombre exacto -->
    <img src="IMG-20261115-WA0003.jpg" alt="Iglesia Bíblica Naciones a la Luz - Alumbrando tu propósito" class="logo-principal">
    
    <!-- Cambia "principal.html" por el nombre de la página a la que quieres que dirija -->
    <a href="principal.html" class="btn-inicio">Inicio</a>
  </main>

</body>
</html>
